<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #result { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #fff; padding: 12px; font-family: sans-serif; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="result">Apuntando a código QR...</div>
    <canvas id="canvas" style="display:none;"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(scan);
            })
            .catch(err => {
                resultDiv.textContent = 'Error de cámara: ' + err.message;
            });

        function scan() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    resultDiv.textContent = code.data;
                    if (window.Android) {
                        window.Android.onQRScanned(code.data);
                    }
                }
            }
            requestAnimationFrame(scan);
        }
    </script>
</body>
</html>
